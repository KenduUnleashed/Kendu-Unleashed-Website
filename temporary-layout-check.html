<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Temporary preview verification</title><style>body{margin:16px;background:#e8e8e8;color:#111;font:15px Arial}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}button,select{font:inherit;padding:8px}iframe{display:block;border:0;height:850px;background:#fff}pre{white-space:pre-wrap;max-width:1100px;font-size:13px}details{margin-bottom:12px}</style></head><body><header><label>Viewport <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><button id="run">Run verification</button><button id="inspect">Inspect layout</button><label>Section <select id="section"><option value="home">Hero</option><option value="athletes">Athletes</option><option value="culture">Culture</option><option value="merch">Merch</option><option value="events">Events</option><option value="energy">Energy</option><option value="contact">Contact</option></select></label></header><p id="status" role="status">Loading…</p><details><summary>Test results</summary><pre id="results"></pre></details><iframe title="Site under test"></iframe><script>
const frame=document.querySelector('iframe'),width=document.querySelector('#width'),status=document.querySelector('#status'),results=document.querySelector('#results');let html;window.testResponse=500;window.testReduced=false;let reports=[];
const pause=ms=>new Promise(r=>setTimeout(r,ms));const paint=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
async function load(reduced=false,noJS=false){window.testReduced=reduced;const setup=`history.replaceState=()=>{};window.qaErrors=[];window.addEventListener('error',e=>qaErrors.push(e.message));const originalMatchMedia=window.matchMedia.bind(window);window.matchMedia=q=>q==='(prefers-reduced-motion: reduce)'?{matches:parent.testReduced,addEventListener(){}}:originalMatchMedia(q);window.fetch=async()=>{if(parent.testResponse==='network')throw new Error('Simulated network failure');return {ok:parent.testResponse===200,status:parent.testResponse};};`;
const source=noJS?html.replace(/<script[^>]*src="\/scripts.js"[^>]*><\/script>/,''):html;await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=source.replace('<head>','<head><base href="'+location.origin+'/"><script>'+setup+'<\/script>');});frame.style.width=width.value+'px';const d=frame.contentDocument;for(const im of d.images)im.loading='eager';await Promise.all([...d.images].map(im=>im.decode().catch(()=>{})));await paint();}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow;const out={width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,broken:[...d.images].filter(i=>!i.naturalWidth).map(i=>i.getAttribute('src')),athletes:[...d.querySelectorAll('.athlete-card h3')].map(e=>e.textContent),products:d.querySelectorAll('.product-card').length,errors:w.qaErrors};status.textContent=JSON.stringify(out);return out;}
function check(name,ok,detail=''){reports.push({name,pass:!!ok,detail});if(!ok)throw new Error(name+' '+detail);results.textContent=JSON.stringify(reports,null,2);}
function touch(vertical=false){const w=frame.contentWindow,target=frame.contentDocument.querySelector('.hero-slides');let t=new w.Touch({identifier:1,target,clientX:240,clientY:120});target.dispatchEvent(new w.TouchEvent('touchstart',{touches:[t]}));t=new w.Touch({identifier:1,target,clientX:vertical?240:60,clientY:vertical?350:124});target.dispatchEvent(new w.TouchEvent('touchend',{changedTouches:[t]}));}
width.onchange=async()=>{frame.style.width=width.value+'px';await paint();inspect();};document.querySelector('#inspect').onclick=inspect;document.querySelector('#section').onchange=e=>frame.contentDocument.getElementById(e.target.value).scrollIntoView();
document.querySelector('#run').onclick=async()=>{reports=[];try{status.textContent='Running layout and interaction checks…';await load(false);let d=frame.contentDocument,w=frame.contentWindow;
for(const size of [320,375,390,430,768,1024,1440,1920]){frame.style.width=size+'px';await paint();const q=inspect();check('Viewport '+size,!q.overflow&&!q.broken.length&&!q.errors.length,JSON.stringify(q));}
frame.style.width='390px';width.value='390';await paint();let toggle=d.querySelector('.navtoggle');toggle.click();check('Menu opens',toggle.getAttribute('aria-expanded')==='true');d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check('Escape closes menu',toggle.getAttribute('aria-expanded')==='false');
const active=()=>[...d.querySelectorAll('.hero-slide')].findIndex(e=>!e.hidden),pb=d.querySelector('.carousel-pause');pb.focus();pb.click();check('First focused Pause click stops slideshow',pb.textContent==='Play');const before=active();pb.click();check('Explicit Play starts slideshow',pb.textContent==='Pause');await pause(8300);check('Autoplay advances',active()!==before);pb.click();check('Pause stops slideshow',pb.textContent==='Play');d.querySelector('.carousel-next').click();const afterNext=active();d.querySelector('.carousel-prev').click();check('Previous/next wrap correctly',active()===(afterNext+2)%3);d.querySelectorAll('.carousel-dots button')[0].click();check('Pagination selects first slide',active()===0);touch(true);check('Vertical gesture preserves slide',active()===0);touch(false);check('Horizontal gesture advances and pauses',active()===1&&pb.textContent==='Play');
for(const el of d.querySelectorAll('details'))el.open=true;frame.style.width='320px';await paint();check('Expanded disclosures at 320',d.documentElement.scrollWidth<=w.innerWidth);frame.style.width='390px';
const f=d.querySelector('form[name="contact"]');f.elements.name.value='Preview test';f.elements.email.value='preview@example.com';f.elements.topic.value='General';f.elements.message.value='Isolated preview validation';window.testResponse=500;f.requestSubmit();await pause(100);check('HTTP failure preserves values',f.elements.name.value==='Preview test'&&!d.querySelector('dialog').open&&f.querySelector('.form-status').textContent.includes('couldn’t'));
window.testResponse='network';f.requestSubmit();await pause(100);check('Network failure remains an error',!d.querySelector('dialog').open&&f.elements.message.value==='Isolated preview validation');window.testResponse=200;f.requestSubmit();await pause(100);check('Contact success opens dialog',d.querySelector('dialog').open&&f.elements.name.value==='');d.querySelector('#thanks-close').click();await paint();check('Close restores focus',!d.querySelector('dialog').open&&d.activeElement===f.querySelector('[type="submit"]'));
const app=d.querySelector('form[name="athlete-application"]');check('Empty application invalid',!app.checkValidity());app.elements['full-name'].value='Test Athlete';app.elements.email.value='preview@example.com';app.elements.discipline.value='Other';app.elements.age.value='18';app.elements.bio.value='Isolated validation';app.requestSubmit();await pause(100);check('Application success opens dialog',d.querySelector('dialog').open);d.querySelector('#thanks-close').click();
await load(true);d=frame.contentDocument;check('Reduced motion starts paused',d.querySelector('.carousel-pause').textContent==='Play');await load(true,true);d=frame.contentDocument;check('No-JS content/menu/form fallback',!d.documentElement.classList.contains('js')&&d.querySelectorAll('.athlete-card').length===6&&d.querySelector('form').getAttribute('action')==='/thank-you.html'&&frame.contentWindow.getComputedStyle(d.querySelector('.navlinks')).display!=='none');
await load(true);status.textContent='PASS — '+reports.length+' checks completed. No real form messages sent.';results.textContent=JSON.stringify(reports,null,2);
}catch(e){status.textContent='FAIL — '+e.message;results.textContent=JSON.stringify(reports,null,2);}};
(async()=>{html=await(await fetch('/index.html')).text();await load(true);inspect();})();
</script></body></html>
