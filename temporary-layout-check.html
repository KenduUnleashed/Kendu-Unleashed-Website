<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><title>Temporary layout verification</title><style>body{font:16px Arial;margin:16px;background:#ddd}header{display:flex;gap:12px;flex-wrap:wrap;padding:12px}iframe{display:block;border:0;background:white;height:850px}pre{white-space:pre-wrap}</style><header><label>Width <select id="width"><option>320</option><option>375</option><option>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Motion <select id="motion"><option value="normal">Normal</option><option value="reduced">Reduced</option></select></label><label>Form response <select id="response"><option>500</option><option>200</option><option>network</option></select></label><button id="reload">Reload test</button><button id="inspect">Inspect layout</button><button id="swipe">Simulate left swipe</button><button id="vertical">Simulate vertical scroll gesture</button></header><pre id="result"></pre><iframe title="Site under test"></iframe><script>
const frame=document.querySelector('iframe'), result=document.querySelector('#result'), width=document.querySelector('#width');
width.onchange=()=>{frame.style.width=width.value+'px'; inspect();};
async function load(){ const html=await (await fetch('/index.html')).text();const reduced=document.querySelector('#motion').value==='reduced',status=document.querySelector('#response').value;
const setup='window.qaErrors=[];window.addEventListener("error",e=>qaErrors.push(e.message));const originalMatchMedia=window.matchMedia.bind(window);window.matchMedia=q=>q==="(prefers-reduced-motion: reduce)"?{matches:'+reduced+',addEventListener(){}}:originalMatchMedia(q);window.fetch=async()=>{'+(status==='network'?'throw new Error("Simulated network failure");':'return {ok:'+(status==='200')+',status:'+status+'};')+'};';
frame.srcdoc=html.replace('<head>','<head><base href="'+location.origin+'/"><script>'+setup+'<\/script>');frame.style.width=width.value+'px';}
function inspect(){const d=frame.contentDocument,w=frame.contentWindow;result.textContent=JSON.stringify({width:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,broken:[...d.images].filter(i=>i.getClientRects().length&&i.complete&&!i.naturalWidth).map(i=>i.src),activeSlide:d.querySelector('.hero-slide:not([hidden])')?.getAttribute('aria-label'),pause:d.querySelector('.carousel-pause')?.textContent,errors:w.qaErrors||[]},null,2);}
document.querySelector('#reload').onclick=load;document.querySelector('#inspect').onclick=inspect;frame.onload=inspect;
function swipe(vertical){const target=frame.contentDocument.querySelector('.hero-slides');const w=frame.contentWindow;let t=new w.Touch({identifier:1,target,clientX:240,clientY:120});target.dispatchEvent(new w.TouchEvent('touchstart',{touches:[t]}));t=new w.Touch({identifier:1,target,clientX:vertical?240:80,clientY:vertical?400:125});target.dispatchEvent(new w.TouchEvent('touchend',{changedTouches:[t]}));inspect();}
document.querySelector('#swipe').onclick=()=>swipe(false);document.querySelector('#vertical').onclick=()=>swipe(true);load();
</script></html>
